name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full_matrix:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

# Supersede an in-flight run when a new commit lands on the same ref, so a
# quick force-push does not queue redundant CI. `main` pushes keep a stable
# group key too, but branch protection serialises them anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOC_SHELL_CANDIDATE: ${{ github.workspace }}/.candidates/doc_shell
    strategy:
      fail-fast: false
      # Main runs the full current gate; PRs run the reduced lane; manual runs cover both OTP versions.
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || inputs.full_matrix) && '[{"elixir":"1.20","otp":"28","check":"elixir"},{"elixir":"1.20","otp":"29","check":"full"}]' || github.event_name == 'push' && '[{"elixir":"1.20","otp":"29","check":"full"}]' || '[{"elixir":"1.20","otp":"29","check":"pr"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: futhr/doc_shell
          ref: 846b67fe34ca07cf7b7b0a744af235912f89e9d4
          path: .candidates/doc_shell
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # file_system uses inotifywait on Linux. The watcher integration test
      # exercises the real backend, which is not bundled with ubuntu-latest.
      - name: Install file-system watcher
        run: sudo apt-get update && sudo apt-get install --yes inotify-tools

      # ExUnit exercises the Pagefind adapter against the pinned workspace
      # binary on both supported Elixir/OTP pairs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Keyed per Elixir/OTP pair: _build (and the dialyzer PLTs inside it)
      # must never be shared across toolchains.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # The core PLT is the expensive half of dialyzer and depends only on the
      # Erlang/Elixir pair, so it must not share the mix.lock-keyed cache above
      # -- otherwise every dependency bump pays a full core rebuild. The local
      # PLT does track deps and is keyed accordingly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.check == 'full'
        with:
          path: priv/plts/core
          key: ${{ runner.os }}-plt-core-${{ matrix.elixir }}-${{ matrix.otp }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.check == 'full'
        with:
          path: priv/plts/local
          key: ${{ runner.os }}-plt-local-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-local-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mkdir -p priv/plts/core priv/plts/local
        if: matrix.check == 'full'

      - run: mix deps.get
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:doc-shell-assets
        if: matrix.check == 'elixir'

      # OTP 28 leg: compile (warnings as errors) + ExUnit only. Formatting,
      # static analysis, and the frontend run once, on the latest toolchain.
      - run: mix compile --warnings-as-errors
        if: matrix.check == 'elixir'
      - run: mix test
        if: matrix.check == 'elixir'

      # One gate: compile (warnings as errors), format, credo, dialyzer,
      # mix_audit, ExUnit+coverage, biome, typecheck, vitest+coverage, knip,
      # and package-export correctness (publint + arethetypeswrong).
      - run: mix check --no-retry
        if: matrix.check == 'full'

      # Full type analysis and exact tarball qualification run locally before release.
      - run: mix check --no-retry --except dialyzer --except hex_consumer --except check_exports
        if: matrix.check == 'pr'

      # One upload per language, so each lcov file is tagged with only its own
      # flag. A single combined upload with `flags: elixir,vite,svelte` tags
      # every file with all three flags, cross-contaminating the per-flag
      # coverage on Codecov.
      - name: Upload Elixir coverage to Codecov
        if: matrix.check != 'elixir'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cover/lcov.info
          flags: elixir
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Vite coverage to Codecov
        if: matrix.check != 'elixir'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: npm/vite/coverage/lcov.info
          flags: vite
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Svelte coverage to Codecov
        if: matrix.check != 'elixir'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: npm/svelte/coverage/lcov.info
          flags: svelte
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
