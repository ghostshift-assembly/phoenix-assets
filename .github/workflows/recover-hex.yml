name: Recover Hex release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag whose exact Hex artifact should be resumed
        required: true
        type: string
      source_run_id:
        description: Release workflow run containing the verified artifact
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish verified Hex artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Check out recovery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: recovery

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate recovery inputs and check out tagged source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Invalid source run id: $SOURCE_RUN_ID" >&2
            exit 1
          }
          git -C recovery worktree add --detach "$GITHUB_WORKSPACE/source" "$RELEASE_TAG"

      - name: Download exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          source_sha=$(git -C source rev-parse HEAD)
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-$source_sha" \
            --dir artifacts

      - name: Verify source identity and complete checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node source/scripts/release.mjs verify \
            --tag "$RELEASE_TAG" \
            --artifact-dir "$GITHUB_WORKSPACE/artifacts"

      - name: Publish exact Hex artifact
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=${RELEASE_TAG#v}
          artifact="$GITHUB_WORKSPACE/artifacts/phoenix_assets-$version.tar"
          published="$RUNNER_TEMP/phoenix_assets-$version.tar"
          status=$(curl --silent --show-error \
            --output "$published" \
            --write-out "%{http_code}" \
            "https://repo.hex.pm/tarballs/phoenix_assets-$version.tar")
          case "$status" in
            200)
              cmp --silent "$artifact" "$published" || {
                echo "Hex release exists with different bytes" >&2
                exit 1
              }
              echo "Already published with identical bytes: phoenix_assets $version"
              ;;
            404)
              elixir recovery/scripts/publish-hex.exs "$artifact"
              ;;
            *)
              echo "Hex preflight failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish HexDocs from tagged source
        working-directory: source
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get
          mix hex.publish docs --yes
