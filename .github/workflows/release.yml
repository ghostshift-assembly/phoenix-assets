name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke exact artifacts without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      full_matrix: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build exact release artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: mix deps.get --check-locked
      - run: pnpm install --frozen-lockfile

      - name: Validate tagged release identity and metadata links
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"

      - name: Validate untagged dry run
        if: github.ref_type != 'tag' && inputs.dry_run
        run: node scripts/release.mjs check --allow-untagged

      - name: Reject untagged production run
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: node scripts/release.mjs check

      - name: Build once and record checksums
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs build --tag "$GITHUB_REF_NAME" --artifact-dir dist/release

      - name: Build once and record checksums (dry run)
        if: github.ref_type != 'tag' && inputs.dry_run
        run: node scripts/release.mjs build --allow-untagged --artifact-dir dist/release

      - name: Smoke exact registry artifacts
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs smoke --tag "$GITHUB_REF_NAME" --artifact-dir dist/release

      - name: Smoke exact registry artifacts (dry run)
        if: github.ref_type != 'tag' && inputs.dry_run
        run: node scripts/release.mjs smoke --allow-untagged --artifact-dir dist/release

      - name: Exercise registry preflight and npm publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref_type == 'tag'
        run: node scripts/release.mjs publish --dry-run --tag "$GITHUB_REF_NAME" --artifact-dir dist/release

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish exact artifacts
    if: github.ref_type == 'tag' && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/release

      - name: Verify downloaded bytes and source identity
        run: node scripts/release.mjs verify --tag "$GITHUB_REF_NAME" --artifact-dir dist/release

      - name: Publish or resume all five registry artifacts
        run: node scripts/release.mjs publish --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish HexDocs from tagged source
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get --check-locked
          mix hex.publish docs --yes

      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
