name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and qualify exact artifacts without publishing
        required: true
        default: true
        type: boolean
      artifact_run_id:
        description: Prior dry-run workflow run containing reviewed artifacts
        type: string
      artifact_id:
        description: Exact artifact ID from that dry run
        type: string
      reviewed_qualification_sha256:
        description: Qualification SHA-256 whose retained screenshots you reviewed
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact reviewed artifact for publication
        if: '!inputs.dry_run'
        env:
          REF_TYPE: ${{ github.ref_type }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_qualification_sha256 }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{64}$ ]]

  quality:
    needs: admission
    uses: ./.github/workflows/ci.yml
    with:
      full_matrix: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build and retain exact qualification evidence
    if: inputs.dry_run
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.4"
          elixir-version: "1.20.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: mix deps.get --check-locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build once and qualify extracted artifacts
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          identity=(--allow-untagged)
          if test "$REF_TYPE" = tag; then identity=(--tag "$GITHUB_REF_NAME"); fi
          node scripts/release.mjs build "${identity[@]}" --artifact-dir dist/release
          node scripts/release.mjs qualify "${identity[@]}" --artifact-dir dist/release
      - name: Exercise registry preflight and npm publish dry run
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs publish --dry-run --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
      - name: Retain archives, consumer locks, emitted output and screenshots
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Identify the review subject
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Run ID: $GITHUB_RUN_ID"
            cat dist/release/qualification.json
            echo "Review the retained screenshots before dispatching publication with these exact IDs and qualification SHA-256."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the retained reviewed artifacts
    if: '!inputs.dry_run'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.4"
          elixir-version: "1.20.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist/release
      - name: Install the locked qualification toolchain
        run: pnpm install --frozen-lockfile
      - name: Verify retained bytes and record the exact screenshot review
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_qualification_sha256 }}
          REVIEWER: ${{ github.actor }}
        run: |
          node scripts/release.mjs verify-qualification --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
          node scripts/release.mjs review-qualification --tag "$GITHUB_REF_NAME" --artifact-dir dist/release --expected-sha "$REVIEWED_SHA" --reviewer "$REVIEWER"
      - name: Publish or resume all five registry artifacts
        run: node scripts/release.mjs publish --tag "$GITHUB_REF_NAME" --artifact-dir dist/release
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish HexDocs from tagged source
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get --check-locked
          mix hex.publish docs --yes
      - name: Retain the complete qualification and release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$RUNNER_TEMP/release-qualification.tar.gz" -C dist/release .
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            if test "$(cat "$RUNNER_TEMP/release-is-draft")" = false; then
              mkdir -p "$RUNNER_TEMP/published-release"
              gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published-release" \
                --pattern '*.tar' --pattern '*.tgz' --pattern release-manifest.json --pattern SHA256SUMS
              for artifact in dist/release/*.tar dist/release/*.tgz dist/release/release-manifest.json dist/release/SHA256SUMS; do
                cmp --silent "$artifact" "$RUNNER_TEMP/published-release/$(basename "$artifact")"
              done
              echo "Published release already retains the verified registry artifacts."
              exit 0
            fi
          else
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Phoenix Assets $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/*.tar dist/release/*.tgz dist/release/*.json dist/release/SHA256SUMS "$RUNNER_TEMP/release-qualification.tar.gz" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
