packages:
  - "npm/*"

# One catalog entry per shared tool; packages reference them with "catalog:"
# so versions cannot drift between npm/vite, npm/svelte, npm/doc-shell, and
# npm/lint. Peer ranges stay wide and hand-written in each package.json — only
# dev-tool versions are catalogued. `pnpm publish` rewrites "catalog:" to the
# resolved range automatically.
catalog:
  "@electric-sql/client": ^1.5.28
  "@sveltejs/package": ^3.0.1
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@tanstack/electric-db-collection": ^0.6.3
  "@tanstack/svelte-db": ^0.5.12
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": ^5.0.5
  happy-dom: ^21.0.4
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  tailwindcss: ^4.3.3
  tsup: ^9.0.0
  # svelte-package still transpiles through TypeScript's JavaScript compiler API.
  # Keep TypeScript 6 until that pipeline supports the native TypeScript 7 API.
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^5.0.5

# Only esbuild may run its dependency install/build script.
allowBuilds:
  esbuild: true

overrides:
  # Svelte's hydratable server renderer uses Devalue 5's uneval replacer API.
  devalue: 5.9.4
  esbuild: 0.28.2
  katex: 0.19.1

minimumReleaseAgeExclude:
  - "@tanstack/db-ivm@0.2.0"
  - "@tanstack/db@0.15.2"
  - "@tanstack/electric-db-collection@0.6.3"
  - "@tanstack/svelte-db@0.5.12"
  - layerchart@2.9.1
  - mermaid@12.2.0
  - katex@0.19.1
